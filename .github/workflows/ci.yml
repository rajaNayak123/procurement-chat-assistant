name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check No Task Data Tracked
        run: |
          chmod +x scripts/check-no-task-data.sh
          ./scripts/check-no-task-data.sh

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build packages
        run: |
          npm run build --workspace=@cantill/policy
          npm run build --workspace=@cantill/engine
          npm run prisma:generate --workspace=@cantill/api
          npm run build --workspace=@cantill/api
          npm run build --workspace=@cantill/web

      - name: Run Tests
        run: |
          npm run test:engine
          npm run test:policy
